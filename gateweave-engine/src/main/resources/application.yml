spring:
  application:
    name: gateweave-engine

gateweave:
  server:
    host: 0.0.0.0
    port: 7397
    max-content-length: 1048576
    boss-threads: 1
    worker-threads: 4
  routing:
    routes:
      - route-id: route-say-hi
        path: /sayHi
        method: GET
        service-id: activity-service
        target:
          protocol: dubbo
          service: cn.bugstack.gateway.rpc.IActivityBooth
          operation: sayHi
          parameters:
            - name: name
              type-name: java.lang.String
          timeout: 3s
          attributes:
            version: 1.0.0
        attributes: {}
  rpc:
    application-name: gateweave-engine
    registry-address: zookeeper://192.168.3.127:2181
    discovery-mode: INTERFACE
  http:
    connect-timeout: 2s
    core-threads: 2
    maximum-threads: 8
    queue-capacity: 256
    keep-alive: 30s
