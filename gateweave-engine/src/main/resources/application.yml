spring:
  application:
    name: gateweave-engine

gateweave:
  control-plane:
    base-uri: ${GATEWEAVE_CONTROL_PLANE_BASE_URI:http://127.0.0.1:8080}
    node-id: ${GATEWEAVE_NODE_ID:gateweave-engine-local}
    gateway-group-id: ${GATEWEAVE_GATEWAY_GROUP_ID:default}
    node-name: ${GATEWEAVE_NODE_NAME:GateWeave Local Engine}
    advertised-address: ${GATEWEAVE_ADVERTISED_ADDRESS:http://127.0.0.1:7397}
    request-timeout: ${GATEWEAVE_CONTROL_PLANE_REQUEST_TIMEOUT:3s}
    refresh-interval: ${GATEWEAVE_CONTROL_PLANE_REFRESH_INTERVAL:PT30S}
  server:
    host: ${GATEWEAVE_SERVER_HOST:0.0.0.0}
    port: ${GATEWEAVE_SERVER_PORT:7397}
    max-content-length: ${GATEWEAVE_SERVER_MAX_CONTENT_LENGTH:1048576}
    boss-threads: ${GATEWEAVE_SERVER_BOSS_THREADS:1}
    worker-threads: ${GATEWEAVE_SERVER_WORKER_THREADS:4}
    connection-backlog: ${GATEWEAVE_SERVER_CONNECTION_BACKLOG:1024}
  routing:
    routes:
      - route-id: route-say-hi
        path: /sayHi
        method: GET
        service-id: activity-service
        authentication-mode: ANONYMOUS
        target:
          protocol: dubbo
          service: cn.bugstack.gateway.rpc.IActivityBooth
          operation: sayHi
          parameters:
            - name: name
              type-name: java.lang.String
          timeout: 3s
          attributes:
            version: 1.0.0
        attributes: { }
  rpc:
    application-name: gateweave-engine
    registry-address: ${GATEWEAVE_RPC_REGISTRY_ADDRESS:zookeeper://127.0.0.1:2181}
    discovery-mode: INTERFACE
  http:
    connect-timeout: 2s
    core-threads: 2
    maximum-threads: 8
    queue-capacity: 256
    keep-alive: 30s
  security:
    jwt:
      issuer: ${GATEWEAVE_JWT_ISSUER:gateweave-issuer}
      audience: ${GATEWEAVE_JWT_AUDIENCE:gateweave-engine}
      verification-key-base64: ${GATEWEAVE_JWT_VERIFICATION_KEY_BASE64}
      clock-skew: 30s
      maximum-token-length: 4096
