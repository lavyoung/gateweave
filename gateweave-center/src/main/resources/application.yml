spring:
  data:
    redis:
      host: ${GATEWEAVE_REDIS_HOST:127.0.0.1}
      port: ${GATEWEAVE_REDIS_PORT:6379}
      password: ${GATEWEAVE_REDIS_PASSWORD:}
      connect-timeout: ${GATEWEAVE_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${GATEWEAVE_REDIS_COMMAND_TIMEOUT:2s}
  messages:
    fallback-to-system-locale: false

gateweave:
  # 发布事件投递配置
  configuration-events:
    topic-prefix: ${GATEWEAVE_CONFIGURATION_EVENT_TOPIC_PREFIX:gateweave:configuration:published}
    delivery:
      enabled: ${GATEWEAVE_EVENT_DELIVERY_ENABLED:true}
      dispatch-interval: ${GATEWEAVE_EVENT_DELIVERY_DISPATCH_INTERVAL:1s}
      batch-size: ${GATEWEAVE_EVENT_DELIVERY_BATCH_SIZE:100}
      lock-duration: ${GATEWEAVE_EVENT_DELIVERY_LOCK_DURATION:30s}
      retry-delay: ${GATEWEAVE_EVENT_DELIVERY_RETRY_DELAY:5s}
      max-attempts: ${GATEWEAVE_EVENT_DELIVERY_MAX_ATTEMPTS:10}
