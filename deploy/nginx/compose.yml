name: gateweave-nginx-lab

services:
  gateway-node-1:
    image: traefik/whoami:v1.12.0
    command:
      - --name=gateweave-engine-1
    networks:
      - gateway-network

  gateway-node-2:
    image: traefik/whoami:v1.12.0
    command:
      - --name=gateweave-engine-2
    networks:
      - gateway-network

  gateway-entry:
    image: nginx:1.30.7-alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway-node-1:
        condition: service_started
      gateway-node-2:
        condition: service_started
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge
