user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $gateway_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    log_format gateway
        '$remote_addr [$time_local] "$request" $status '
        'request_id=$gateway_request_id '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log gateway;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    upstream gateway_nodes {
        least_conn;

        server gateway-node-1:80 max_fails=2 fail_timeout=10s;
        server gateway-node-2:80 max_fails=2 fail_timeout=10s;

        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /gateway {
            return 308 /gateway/;
        }

        location /gateway/ {
            proxy_pass http://gateway_nodes/;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $gateway_request_id;

            proxy_connect_timeout 1s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Request-Id $gateway_request_id always;
        }
    }
}
